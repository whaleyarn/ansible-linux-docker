---
docker_proxy_env: "{{ proxy_env | default({}) }}"
docker_apt_mirror_region: "default"
docker_apt_mirrors:
  default: 'https://download.docker.com/linux/{{ ansible_facts["distribution"] | lower }}/'
  cn: 'https://mirrors.tuna.tsinghua.edu.cn/docker-ce/linux/{{ ansible_facts["distribution"] | lower }}/'
docker_daemon_config:
  registry-mirrors: []
